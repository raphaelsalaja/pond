name: Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for UI tests
        run: pnpm --filter @pond/ui exec playwright install --with-deps chromium

      - name: Update screenshot baselines
        run: pnpm --filter @pond/ui test:browser:update

      - uses: actions/upload-artifact@v7
        with:
          name: ui-screenshot-baselines
          path: packages/ui/src/**/__screenshots__/**
          if-no-files-found: error
