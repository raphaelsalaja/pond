[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
xeet-core = { path = "../../../xeet/crates/xeet-core" }
kit = { path = "crates/kit" }
bluesky = { path = "crates/bluesky" }
threads = { path = "crates/threads" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 2
