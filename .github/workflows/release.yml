name: Release

on:
  push:
    tags:
      - "v*"
      - "!v*-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validates the tag and credentials once, then creates the draft release that
  # the platform jobs upload into in parallel. Nothing is public until the
  # publish job runs, so a failed platform build never ships a partial release.
  draft:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify release versions
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion)) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must use vX.Y.Z`);
          }

          const readJsonVersion = (path) =>
            JSON.parse(readFileSync(path, "utf8")).version;
          const readSourceVersion = (path, pattern) => {
            const match = readFileSync(path, "utf8").match(pattern);
            if (!match) throw new Error(`Version not found in ${path}`);
            return match[1];
          };
          const versions = [
            ["apps/desktop/package.json", readJsonVersion("apps/desktop/package.json")],
            ["apps/extension/package.json", readJsonVersion("apps/extension/package.json")],
            [
              "apps/extension/wxt.config.ts",
              readSourceVersion(
                "apps/extension/wxt.config.ts",
                /manifest:[\s\S]*?\bversion:\s*"([^"]+)"/,
              ),
            ],
            [
              "apps/website/lib/release.ts",
              readSourceVersion(
                "apps/website/lib/release.ts",
                /POND_VERSION\s*=\s*"([^"]+)"/,
              ),
            ],
          ];
          const mismatches = versions.filter(([, version]) => version !== releaseVersion);
          if (mismatches.length) {
            for (const [path, version] of mismatches) {
              console.error(`${path} has ${version}; expected ${releaseVersion}`);
            }
            process.exit(1);
          }
          NODE

      - name: Require signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Write release notes
        run: |
          ENTRY="changelog/${GITHUB_REF_NAME#v}.md"
          if [ ! -f "$ENTRY" ]; then
            echo "Missing $ENTRY. Add a changelog entry before tagging."
            exit 1
          fi
          ENTRY="$ENTRY" node --input-type=module > "$RUNNER_TEMP/release-notes.md" <<'NODE'
          import { readFileSync } from "node:fs";

          const source = readFileSync(process.env.ENTRY, "utf8");
          const [, head, body] =
            source.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/) ?? [];
          const field = (key) =>
            head?.match(new RegExp(`^${key}:\\s*(.+)$`, "m"))?.[1]?.trim();
          const title = field("title");
          const summary = field("summary");
          if (!title || !summary || !body?.trim()) {
            throw new Error(`${process.env.ENTRY} needs a title, summary, and sections`);
          }
          process.stdout.write(`**${title}**\n\n${summary}\n\n${body.trim()}\n`);
          NODE

      # Lives only in the GitHub notes: the in-app changelog parser rejects
      # sections other than Important, New, Improved, and Fixed.
      - name: Credit contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$PREVIOUS" ] || [ "$PREVIOUS" = "$GITHUB_REF_NAME" ]; then
            exit 0
          fi
          LOGINS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS...$GITHUB_REF_NAME" \
            --jq '.commits[] | select(.author.type == "User") | .author.login' \
            | grep -Fvx "$OWNER" | sort -fu || true)"
          if [ -z "$LOGINS" ]; then
            exit 0
          fi
          {
            printf '\n## Contributors\n\n'
            while read -r login; do printf -- '- @%s\n' "$login"; done <<<"$LOGINS"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Pond ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  macos:
    needs: draft
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # electron-builder packages both Mac architectures in this job. Install
        # both native dependency variants here without bloating normal dev/CI
        # installs with every dependency's second architecture.
        run: pnpm install --frozen-lockfile --os=darwin --cpu=arm64 --cpu=x64

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Generated files are up to date
        run: pnpm generate && git diff --exit-code

      - name: Verify workspace
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      - name: Package macOS app and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @pond/desktop dist:mac:publish

      - name: Build extension store zips
        run: pnpm --filter @pond/extension zip:store

      - name: Upload extension zips to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT=apps/extension/.output
          ZIPS=()
          for kind in chrome firefox sources; do
            ZIP="$OUT/pond-extension-${VERSION}-${kind}.zip"
            if [ ! -f "$ZIP" ]; then
              echo "Missing $ZIP"
              exit 1
            fi
            ZIPS+=("$ZIP")
          done
          gh release upload "$GITHUB_REF_NAME" "${ZIPS[@]}" --clobber

  windows:
    needs: draft
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # The repository has deep paths that exceed MAX_PATH on Windows runners.
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      # Antivirus engines quarantine unsigned Windows apps. Azure Artifact
      # Signing is preferred: set the AZURE_TENANT_ID, AZURE_CLIENT_ID, and
      # AZURE_CLIENT_SECRET secrets plus the AZURE_SIGNING_ENDPOINT,
      # AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, and
      # AZURE_SIGNING_PUBLISHER variables. A PFX certificate in WIN_CSC_LINK
      # and WIN_CSC_KEY_PASSWORD also works. Without either, the installer
      # ships unsigned with a warning.
      - name: Package Windows app and upload to release
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          ARGS=()
          SIGNED=true
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER; do
              if [ -z "${!name}" ]; then
                echo "Missing Azure Artifact Signing setting: $name"
                exit 1
              fi
            done
            echo "Windows code signing: Azure Artifact Signing"
            ARGS+=(
              "--config.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
              "--config.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
              "--config.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
              "--config.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
            )
          elif [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "Windows code signing: certificate"
          else
            echo "::warning::No Windows signing credentials; the installer will be unsigned and antivirus may quarantine it."
            SIGNED=false
          fi
          if [ "$SIGNED" = true ]; then
            ARGS+=(--config.win.forceCodeSigning=true)
          fi
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          # `pnpm exec` skips cmd.exe, which would re-split a publisher name with spaces.
          pnpm --filter @pond/desktop exec node ./scripts/build-native-host.mjs
          pnpm --filter @pond/desktop exec electron-builder --win --x64 --config.npmRebuild=false --publish always "${ARGS[@]}"

      - name: Verify Windows signatures
        if: steps.package.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/dist/*.exe) +
            @(Get-ChildItem apps/desktop/dist/win-unpacked -Recurse -Include *.exe,*.dll,*.node)
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" }
          if ($unsigned) {
            $unsigned | ForEach-Object { Write-Output "Unsigned: $($_.FullName)" }
            exit 1
          }
          Write-Output "Verified $($files.Count) signed files"

  linux:
    needs: draft
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential fakeroot xvfb

      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a pnpm --filter @pond/desktop smoke:desktop

      - name: Package Linux app and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @pond/desktop dist:linux:publish

  # Builds the arm64 packages on an arm64 runner: the native dependencies
  # rebuild for the build host, so this cannot be cross-built from `linux`.
  linux-arm64:
    needs: draft
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential fakeroot xvfb

      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a pnpm --filter @pond/desktop smoke:desktop

      - name: Package Linux app and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @pond/desktop dist:linux:publish

  publish:
    needs: [linux, linux-arm64, macos, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Merge Linux update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Each Linux job publishes a single-arch latest-linux.yml and the
          # later upload overwrites the earlier one. electron-updater picks the
          # entry whose URL contains its own architecture, so the release needs
          # one manifest listing both. Rebuild it from the uploaded artifacts.
          for name in \
            "Pond-${VERSION}-x64.AppImage" \
            "Pond-${VERSION}-arm64.AppImage" \
            "Pond-${VERSION}-x64.AppImage.blockmap" \
            "Pond-${VERSION}-arm64.AppImage.blockmap" \
            "Pond-${VERSION}-x64.deb" \
            "Pond-${VERSION}-arm64.deb"; do
            gh release download "$GITHUB_REF_NAME" --pattern "$name"
          done
          sha512() { openssl dgst -sha512 -binary "$1" | base64 -w 0; }
          size() { stat -c%s "$1"; }
          cat > latest-linux.yml <<EOF
          version: ${VERSION}
          files:
            - url: Pond-${VERSION}-x64.AppImage
              sha512: $(sha512 "Pond-${VERSION}-x64.AppImage")
              size: $(size "Pond-${VERSION}-x64.AppImage")
              blockMapSize: $(size "Pond-${VERSION}-x64.AppImage.blockmap")
            - url: Pond-${VERSION}-arm64.AppImage
              sha512: $(sha512 "Pond-${VERSION}-arm64.AppImage")
              size: $(size "Pond-${VERSION}-arm64.AppImage")
              blockMapSize: $(size "Pond-${VERSION}-arm64.AppImage.blockmap")
            - url: Pond-${VERSION}-x64.deb
              sha512: $(sha512 "Pond-${VERSION}-x64.deb")
              size: $(size "Pond-${VERSION}-x64.deb")
            - url: Pond-${VERSION}-arm64.deb
              sha512: $(sha512 "Pond-${VERSION}-arm64.deb")
              size: $(size "Pond-${VERSION}-arm64.deb")
          path: Pond-${VERSION}-x64.AppImage
          sha512: $(sha512 "Pond-${VERSION}-x64.AppImage")
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)'
          EOF
          gh release upload "$GITHUB_REF_NAME" latest-linux.yml --clobber
          gh release download "$GITHUB_REF_NAME" --pattern "latest-linux.yml" --dir merged-check
          grep -q "Pond-${VERSION}-x64.AppImage" merged-check/latest-linux.yml
          grep -q "Pond-${VERSION}-arm64.AppImage" merged-check/latest-linux.yml
          echo "Merged latest-linux.yml lists both architectures"
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          missing=0
          for name in \
            "Pond-${VERSION}-arm64.dmg" \
            "Pond-${VERSION}-x64.dmg" \
            "Pond-${VERSION}-arm64.zip" \
            "Pond-${VERSION}-x64.zip" \
            "latest-mac.yml" \
            "Pond-${VERSION}-x64.exe" \
            "Pond-${VERSION}-x64.exe.blockmap" \
            "latest.yml" \
            "Pond-${VERSION}-x64.AppImage" \
            "Pond-${VERSION}-x64.AppImage.blockmap" \
            "Pond-${VERSION}-arm64.AppImage" \
            "Pond-${VERSION}-arm64.AppImage.blockmap" \
            "Pond-${VERSION}-x64.deb" \
            "Pond-${VERSION}-arm64.deb" \
            "latest-linux.yml" \
            "pond-extension-${VERSION}-chrome.zip" \
            "pond-extension-${VERSION}-firefox.zip" \
            "pond-extension-${VERSION}-sources.zip"; do
            if ! grep -Fxq "$name" <<<"$ASSETS"; then
              echo "Missing release asset: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

  # Scans the published Windows release with VirusTotal and reports detections
  # in the job summary. It never blocks a release: submit a false positive to
  # each vendor it lists. Skipped with a warning until VIRUSTOTAL_API_KEY is set.
  virustotal:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download and unpack the Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "Pond-${VERSION}-x64.exe" \
            --dir virustotal
          7z x -y -ovirustotal/unpacked "virustotal/Pond-${VERSION}-x64.exe" >/dev/null
          NESTED='virustotal/unpacked/$PLUGINSDIR/app-64.7z'
          if [ -f "$NESTED" ]; then
            7z x -y -ovirustotal/unpacked "$NESTED" >/dev/null
          fi

      - name: Scan with VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/virustotal-scan.mjs \
            "virustotal/Pond-${VERSION}-x64.exe" \
            virustotal/unpacked/Pond.exe \
            virustotal/unpacked/resources/bin/pond-native-host.exe

  # Submits the published extension zips for store review. Each store is
  # skipped with a warning until its API credentials are set as secrets.
  stores:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @pond/extension...

      - name: Download extension zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "pond-extension-*.zip" \
            --dir extension-zips

      - name: Submit to browser stores
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: desktop@pond.so
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="$PWD/extension-zips"
          ARGS=()
          if [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ] && [ -n "$CHROME_EXTENSION_ID" ]; then
            ARGS+=(--chrome-zip "$DIR/pond-extension-${VERSION}-chrome.zip")
          else
            echo "::warning::Chrome Web Store secrets are not set; skipping Chrome."
          fi
          if [ -n "$FIREFOX_JWT_SECRET" ]; then
            ARGS+=(--firefox-zip "$DIR/pond-extension-${VERSION}-firefox.zip")
            ARGS+=(--firefox-sources-zip "$DIR/pond-extension-${VERSION}-sources.zip")
          else
            echo "::warning::AMO secrets are not set; skipping Firefox."
          fi
          if [ "${#ARGS[@]}" -eq 0 ]; then
            exit 0
          fi
          pnpm --filter @pond/extension exec wxt submit "${ARGS[@]}"

  homebrew:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Download macOS release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir homebrew-artifacts
          gh release download "$GITHUB_REF_NAME" \
            --pattern "Pond-${VERSION}-arm64.dmg" \
            --pattern "Pond-${VERSION}-x64.dmg" \
            --dir homebrew-artifacts

      - name: Update Homebrew cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-homebrew-cask.mjs \
            "$VERSION" \
            "homebrew-artifacts/Pond-${VERSION}-arm64.dmg" \
            "homebrew-artifacts/Pond-${VERSION}-x64.dmg"

      - name: Commit Homebrew cask
        run: |
          if git diff --quiet -- Casks/pond.rb; then
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pond.rb
          git commit -m "chore(release): update Homebrew cask to ${VERSION}"
          git push origin HEAD:main
