name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          turbo-cache: lint

      - name: Generated files are up to date
        run: pnpm generate && git diff --exit-code

      - name: Dev runtime guard
        run: node --test scripts/run-dev-singleton.test.mjs

      - name: Lint, architecture, and unused code
        run: pnpm exec turbo run lint:repo oxlint:repo architecture:check:repo knip:repo generate:check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          turbo-cache: typecheck

      - name: Typecheck
        run: pnpm exec turbo run typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # The repository has deep paths that exceed MAX_PATH on Windows runners.
      - if: runner.os == 'Windows'
        name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          turbo-cache: test

      - name: Install browser for UI tests
        run: pnpm --filter @pond/ui exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Package tests
        run: pnpm exec turbo run test --filter=!@pond/desktop

      - name: Upload UI screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshot-diffs-${{ runner.os }}
          path: packages/ui/.vitest/attachments
          if-no-files-found: ignore

  desktop-test:
    name: desktop-test (${{ matrix.os }}, ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]

    steps:
      - if: runner.os == 'Windows'
        name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          turbo-cache: desktop-test-${{ matrix.shard }}

      - name: Desktop tests
        run: pnpm exec turbo run test --filter=@pond/desktop -- --shard=${{ matrix.shard }}/4

  # Build and launch the real app on every platform. These jobs skip the
  # Turborepo cache because a cached build leaves no output to launch.
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Native database tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @pond/desktop exec electron node_modules/vitest/vitest.mjs run src/main/db.test.ts src/main/core/vec-index.test.ts src/main/core/pipeline/task-recovery.test.ts src/main/core/pipeline/enqueue-scheduling.test.ts src/main/core/refresh/archive-backfill.test.ts src/main/core/session-downloads.test.ts src/main/core/inbox/inbox.test.ts

      - name: Build
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a pnpm --filter @pond/desktop smoke:desktop

      - name: Desktop memory budgets
        run: xvfb-run -a pnpm --filter @pond/desktop smoke:memory

  windows:
    runs-on: windows-latest

    steps:
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Native database tests
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: pnpm --filter @pond/desktop exec electron node_modules/vitest/vitest.mjs run src/main/db.test.ts src/main/core/vec-index.test.ts src/main/core/pipeline/task-recovery.test.ts src/main/core/pipeline/enqueue-scheduling.test.ts src/main/core/refresh/archive-backfill.test.ts src/main/core/session-downloads.test.ts src/main/core/inbox/inbox.test.ts

      - name: Build
        run: pnpm build

      # Windows runners provide an interactive desktop session, so no xvfb.
      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      - name: Desktop memory budgets
        run: pnpm --filter @pond/desktop smoke:memory

  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Native database tests
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: pnpm --filter @pond/desktop exec electron node_modules/vitest/vitest.mjs run src/main/db.test.ts src/main/core/vec-index.test.ts src/main/core/pipeline/task-recovery.test.ts src/main/core/pipeline/enqueue-scheduling.test.ts src/main/core/refresh/archive-backfill.test.ts src/main/core/session-downloads.test.ts src/main/core/inbox/inbox.test.ts

      - name: Build
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      - name: Desktop memory budgets
        run: pnpm --filter @pond/desktop smoke:memory

  # The native dependency set (better-sqlite3 rebuild, sqlite-vec, sharp,
  # onnxruntime, ffmpeg-static) resolves to linux-arm64 builds only here, so
  # this is the job that catches an arm64 break in any of them.
  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - uses: ./.github/actions/setup

      - name: Native database tests
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: pnpm --filter @pond/desktop exec electron node_modules/vitest/vitest.mjs run src/main/db.test.ts src/main/core/vec-index.test.ts src/main/core/pipeline/task-recovery.test.ts src/main/core/pipeline/enqueue-scheduling.test.ts src/main/core/refresh/archive-backfill.test.ts src/main/core/session-downloads.test.ts src/main/core/inbox/inbox.test.ts

      - name: Build
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: |
          SANDBOX="$(dirname "$(cd apps/desktop && node -p "require('electron')")")/chrome-sandbox"
          sudo chown root:root "$SANDBOX"
          sudo chmod 4755 "$SANDBOX"
          xvfb-run -a pnpm --filter @pond/desktop smoke:desktop
