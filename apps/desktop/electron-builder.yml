appId: so.pond.desktop
productName: Pond
copyright: "Copyright © 2026 Raphael Salaja"
asar: true
# Native .node binaries (better-sqlite3) can't live inside the asar
# archive or dlopen() can't find them.
asarUnpack:
  - resources/**
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/sqlite-vec/**"
  - "**/node_modules/sqlite-vec-*/**"
  # onnxruntime loads sibling shared libraries (onnxruntime.dll on Windows)
  # that the .node unpack above does not take along.
  - "**/node_modules/onnxruntime-node/**"
  # sharp loads a sibling dylib. The .node unpack above does not take it along.
  - "**/node_modules/@img/**"
  - "**/node_modules/sharp/**"

directories:
  buildResources: build
  output: dist

# Windows / Linux app icon (from packages/icons/brand/tints/aqua via prepare-app-icon).
icon: icon.png

files:
  - out/**/*
  - package.json
  # Vite bundles main, preload, and the renderer into `out`, so app.asar ships
  # only the packages main loads from disk at runtime (the externals in
  # electron.vite.config.ts, plus onnxruntime-node, which transformers
  # requires by name) and their runtime dependencies. electron-builder applies
  # only exclusions to node_modules, so the allowlist is one negated extglob.
  # scripts/verify-runtime-packages.cjs fails the pack when it falls behind.
  - "!node_modules/!(better-sqlite3|sqlite-vec|sqlite-vec-*|sharp|@img|detect-libc|semver|onnxruntime-node|onnxruntime-common){,/**}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{d.ts,map}"
  - "!**/*.tsbuildinfo"
  # better-sqlite3 loads its prebuilt binary; the SQLite and C++ sources only
  # matter when it compiles from source.
  - "!node_modules/better-sqlite3/{deps,src}/**"

# Tray icons and any other runtime-loaded assets. At runtime we read
# them from `process.resourcesPath` which lands inside `Contents/Resources`
# on macOS / `resources/` on Windows+Linux.
#
# `node_modules/ffmpeg-static/ffmpeg` is the static ffmpeg yt-dlp uses
# to mux adaptive streams (most TikTok / IG Reels / YT downloads need
# it). `extraResources` flattens it into `bin/` so `binariesAvailable`
# can spawn it as a separate process (asar paths aren't executable). The
# executable name differs per OS, so it is declared in `mac:` and `win:`.
# yt-dlp is not bundled: it's fetched at runtime into userData.
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
      # App extensions belong in Contents/PlugIns only; see mac.extraFiles.
      - "!SafariExtension{,/**}"
      - "!ShareExtension{,/**}"
  - from: ../../packages/icons/brand/tints
    to: app-icons
    filter:
      - "**/default.png"

extraMetadata:
  main: ./out/main/index.js

# Fail the pack if the bundled ffmpeg is missing, so a release never goes
# out unable to mux downloaded video.
afterPack: scripts/verify-binaries.cjs
afterAllArtifactBuild: scripts/fix-dmg-window.cjs

# electron-builder rebuilds native modules against the packaged Electron
# ABI before bundling. Combined with the `postinstall` script in
# package.json this gives us a clean `better-sqlite3` binary on dev
# install AND on CI.
npmRebuild: true

publish:
  provider: github
  owner: raphaelsalaja
  repo: pond
  releaseType: release

mac:
  category: public.app-category.productivity
  # Prefer `icon.icon` (Icon Composer) when actool 26+ is available; until then
  # the Default-export icns ships the same mark for Dock / DMG / older macOS.
  icon: icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # electron-updater installs macOS updates from the zip, not the DMG.
    - target: zip
      arch:
        - arm64
        - x64
  # Signing reads CSC_LINK and CSC_KEY_PASSWORD; notarization reads APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID. Without them it is skipped.
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  # The inherit entitlements are applied to the bundled ffmpeg binary (and
  # any child process Pond spawns, e.g. the runtime yt-dlp) so they survive
  # the hardened runtime after notarization.
  entitlements: packaging/entitlements.mac.plist
  entitlementsInherit: packaging/entitlements.mac.inherit.plist
  # Signs the app extensions, which electron-builder skips, then the app as usual.
  sign: scripts/sign-mac.cjs
  extraResources:
    # One runner packages both architectures, so ffmpeg comes per arch from
    # scripts/fetch-mac-ffmpeg.mjs rather than the runner-only ffmpeg-static copy.
    - from: vendor/ffmpeg/darwin-${arch}/ffmpeg
      to: bin/ffmpeg
    # Loaded by the main process to open Safari at Pond's extension; Safari answers
    # only the main process of the app that holds the extension.
    - from: resources/SafariExtension/safari-settings.node
      to: safari-settings.node
    # Opens the app group container through containermanagerd, which macOS requires
    # before an unsandboxed app may create the Safari socket in it.
    - from: resources/SafariExtension/app-group.node
      to: app-group.node
  # App extensions: the Safari App Extension (scripts/build-safari-extension.mjs) and
  # the Share extension (scripts/build-share-extension.mjs). Safari cannot launch an
  # external native-messaging host, so its handler ships inside the app bundle; macOS
  # only loads a .appex from Contents/PlugIns, and sign-mac.cjs signs each one.
  extraFiles:
    - from: resources/SafariExtension/Pond Extension.appex
      to: PlugIns/Pond Extension.appex
    - from: resources/ShareExtension/Pond Share.appex
      to: PlugIns/Pond Share.appex
  # Register `.pond` as a macOS package so Finder shows a library as a
  # single bundle instead of a folder full of items/, trash/, metadata.
  # LaunchServices only honors this in packaged builds, not `dev`.
  extendInfo:
    UTExportedTypeDeclarations:
      - UTTypeIdentifier: so.pond.library
        UTTypeDescription: Pond Library
        UTTypeConformsTo:
          - com.apple.package
        UTTypeTagSpecification:
          public.filename-extension:
            - pond
    CFBundleDocumentTypes:
      - CFBundleTypeName: Pond Library
        CFBundleTypeRole: Editor
        LSTypeIsPackage: true
        LSItemContentTypes:
          - so.pond.library
        CFBundleTypeExtensions:
          - pond
      # Lets the Dock icon accept any file or folder as an import. Alternate
      # rank keeps Pond from becoming the default app for those files.
      - CFBundleTypeName: Importable File
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.item

dmg:
  title: "${productName}"
  sign: false
  background: packaging/dmg/background.png
  iconSize: 96
  window:
    width: 720
    height: 440
  contents:
    - x: 180
      y: 200
      type: file
    - x: 540
      y: 200
      type: link
      path: /Applications

# Windows arm64 stays disabled until the native dependency set is verified on
# an arm64 runner. The x64 build produces the installer and latest.yml used by
# electron-updater.
#
# Release builds sign through Azure Artifact Signing; the release workflow passes
# `azureSignOptions` and `forceCodeSigning` on the command line so local and
# pull request builds stay unsigned. Antivirus engines quarantine unsigned
# binaries, so every executable and native module is signed, not just Pond.exe.
win:
  artifactName: ${productName}-${version}-${arch}.${ext}
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: bin/ffmpeg.exe
  signExts:
    - .dll
    - .node
  target:
    - target: nsis
      arch:
        - x64

# Per-user one-click install: no UAC prompt, and electron-updater can replace
# the app silently. `pond://` is registered at runtime by
# `app.setAsDefaultProtocolClient`, which writes to HKCU in packaged builds.
# The native messaging keys are written by `packaging/installer.nsh`.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  deleteAppDataOnUninstall: false
  # Removes the HKCU registrations Pond writes at runtime; keeps the Library.
  include: packaging/installer.nsh

# Linux ships x64 AppImage and deb packages. electron-builder writes
# latest-linux.yml for the AppImage updater; the deb is installed and upgraded
# by the system package manager. `pond.desktop` also registers the `pond://`
# handler and the tray/window class used by the menu and the CLI.
linux:
  artifactName: ${productName}-${version}.${ext}
  category: Utility
  executableName: pond
  icon: icon.png
  maintainer: Raphael Salaja <raphaelsalaja@users.noreply.github.com>
  synopsis: A local-first archive for everything you save
  description: >-
    Pond keeps everything you save across social sources and the web in one
    local-first library on your computer.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg
      to: bin/ffmpeg
  desktop:
    entry:
      Keywords: archive;saves;library;inspiration;
      MimeType: x-scheme-handler/pond;
      StartupWMClass: Pond
